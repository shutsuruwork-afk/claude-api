# Deploy index.html to a Hugging Face Space (static SDK).
# Setup: add a Hugging Face write token as the repository secret HF_TOKEN.
# The Space is created automatically at huggingface.co/spaces/<your HF user>/<SPACE_NAME>.
name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
    paths: [index.html, .github/workflows/deploy-hf-space.yml]
  workflow_dispatch:

env:
  SPACE_NAME: p2p-test

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check token
        id: check
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::HF_TOKEN secret is not set; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: '3.12'

      - name: Upload to Space
        if: steps.check.outputs.skip != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q huggingface_hub
          mkdir space
          cp index.html space/
          cat > space/README.md <<'MD'
          ---
          title: P2P Test
          emoji: 🔗
          colorFrom: blue
          colorTo: green
          sdk: static
          pinned: false
          ---

          WebRTC P2P connection and multi-peer sync test.
          Source: https://github.com/${{ github.repository }}
          MD
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          user = api.whoami()["name"]
          repo_id = f"{user}/{os.environ['SPACE_NAME']}"
          api.create_repo(repo_id, repo_type="space", space_sdk="static", exist_ok=True)
          api.upload_folder(folder_path="space", repo_id=repo_id, repo_type="space",
                            commit_message=f"Deploy {os.environ['GITHUB_SHA'][:7]}")
          print(f"Deployed: https://huggingface.co/spaces/{repo_id}")
          PY
