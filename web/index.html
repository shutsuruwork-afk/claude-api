<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.anthropic.com; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1c1a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Claude">
<title>Claude</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="vendor/github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="vendor/github-dark.min.css" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <button class="new-chat" id="newChat" type="button">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
        新しい会話
      </button>
    </div>
    <nav class="conv-list" id="convList" aria-label="会話一覧"></nav>
    <div class="sidebar-foot">
      <button class="key-btn" id="keyBtn" type="button" hidden>APIキー</button>
      <div class="spend">
        <span>これまでの利用</span>
        <strong id="totalCost">$0.00</strong>
      </div>
      <div class="spend sub">
        <span>キャッシュによる節約</span>
        <span id="totalSaved">$0.00</span>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="会話一覧を開く">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <label class="select">
        <span class="sr-only">モデル</span>
        <select id="modelSelect"></select>
      </label>
      <label class="select">
        <span class="sr-only">思考の深さ</span>
        <select id="effortSelect">
          <option value="">思考: 既定</option>
          <option value="low">思考: 軽め</option>
          <option value="medium">思考: 中</option>
          <option value="high">思考: 深め</option>
          <option value="xhigh">思考: かなり深め</option>
          <option value="max">思考: 最大</option>
        </select>
      </label>
      <span class="topbar-cost" id="convCost"></span>
    </header>

    <div class="banner" id="banner" hidden></div>

    <div class="scroll" id="scroll">
      <div class="thread" id="thread"></div>
    </div>

    <form class="composer" id="composer">
      <div class="composer-box">
        <textarea id="input" rows="1" placeholder="Claude にメッセージを送る" autofocus></textarea>
        <button class="send" id="sendBtn" type="submit" aria-label="送信">
          <svg class="i-send" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M10 16V4M5 9l5-5 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          <svg class="i-stop" viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><rect x="4" y="4" width="12" height="12" rx="2" fill="currentColor"/></svg>
        </button>
      </div>
      <p class="hint">Enter で送信 ・ Shift+Enter で改行</p>
    </form>
  </main>
</div>

<dialog class="key-dialog" id="keyDialog">
  <h2>APIキー</h2>
  <p>Claude Console で作成したキー(<code>sk-ant-...</code>)を貼り付けてください。</p>
  <input id="keyInput" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="sk-ant-..." aria-label="APIキー">
  <p class="key-status" id="keyStatus"></p>
  <ul>
    <li>キーはこの端末のブラウザにだけ保存され、Claude API(api.anthropic.com)以外には送られません。</li>
    <li>端末を失くしたときは、Console でこのキーを無効にしてください。</li>
  </ul>
  <div class="key-actions">
    <button id="keyDelete" type="button" class="danger">キーを削除</button>
    <button id="keyCancel" type="button">閉じる</button>
    <button id="keySave" type="button" class="primary">保存</button>
  </div>
</dialog>

<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="direct.js"></script>
<script src="app.js"></script>
</body>
</html>
